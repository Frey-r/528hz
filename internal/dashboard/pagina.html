<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>hz · panel de agentes</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1416; --halo: rgba(34, 168, 142, .14);
  --panel: rgba(255, 255, 255, .035); --borde: rgba(255, 255, 255, .08);
  --fg: #e4efec; --fg2: #a3b8b3; --fg3: #74897f;
  --grid: rgba(255, 255, 255, .07); --base: rgba(255, 255, 255, .12);
  --serie: #22a88e; --serie-suave: #176b5b;
  --ok-tx: #8edb8e; --warn: #fab219; --crit: #d03b3b; --crit-tx: #f3a7a7; --crit-fondo: rgba(208, 59, 59, .17);
  --chip: rgba(255, 255, 255, .06);
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f7fbfa; --halo: rgba(14, 140, 117, .10);
    --panel: rgba(255, 255, 255, .8); --borde: rgba(15, 40, 36, .10);
    --fg: #0f201d; --fg2: #46605b; --fg3: #687e79;
    --grid: rgba(15, 40, 36, .08); --base: rgba(15, 40, 36, .16);
    --serie: #0e8c75; --serie-suave: #4dae99;
    --ok-tx: #0a6e0a; --crit-tx: #a32424; --crit-fondo: rgba(208, 59, 59, .10);
    --chip: rgba(15, 40, 36, .05);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
  font: 14px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  background-image: radial-gradient(900px 480px at 92% -10%, var(--halo), transparent 70%); background-repeat: no-repeat;
}
.marco { max-width: 1280px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 40px; }
.barra-sup { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.marca { font: 600 18px/1.2 "Space Grotesk", "Segoe UI", system-ui, sans-serif; letter-spacing: -.01em; }
.marca span { color: var(--fg3); font-weight: 500; }
.controles { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controles button {
  font: inherit; font-size: 12.5px; color: var(--fg2); background: var(--chip); border: 1px solid var(--borde);
  border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.controles button[aria-pressed="true"] { color: var(--fg); border-color: var(--serie); }
#estado { color: var(--fg3); font-size: 12px; margin-left: 8px; }
#estado[data-ok="false"] { color: var(--crit-tx); }
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.cab { padding: 14px 18px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.cab .titulo { font-size: 15px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--fg2); display: inline-flex; gap: 8px; align-items: center; }
.chips li.sin { background: var(--crit-fondo); color: var(--crit-tx); }
.barrita { display: inline-block; width: 70px; height: 5px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.barrita > span { display: block; height: 100%; background: var(--serie); }
.sin .barrita > span { background: var(--crit); }
.grilla { display: grid; grid-template-columns: minmax(170px, 260px) minmax(0, 1fr) minmax(170px, 240px); padding: 6px 18px 14px; }
.fila, .enc { display: contents; }
.enc > span { color: var(--fg3); font-size: 12px; padding: 8px 0 6px; border-bottom: 1px solid var(--borde); }
.eje { display: flex; justify-content: space-between; padding-left: 0; padding-right: 0; }
.enc > span:last-child { padding-left: 14px; }
.fila > * { padding: 7px 0; border-bottom: 1px solid var(--grid); min-width: 0; }
.nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; }
.n1 { padding-left: 16px; } .n2 { padding-left: 32px; } .n3 { padding-left: 48px; } .n4 { padding-left: 64px; } .n5 { padding-left: 80px; }
.glifo { display: inline-block; width: 1.3em; color: var(--serie); }
.fila.fin .nombre, .fila.fin .resumen { color: var(--fg3); }
.fila.fin .glifo { color: var(--fg3); }
.fila.alerta .glifo, .fila.alerta .resumen { color: var(--crit-tx); }
.tarea { color: var(--fg3); font-size: 12.5px; }
.carril { width: 100%; height: 24px; display: block; align-self: center; }
.carril .base { stroke: var(--base); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ev.ok { fill: var(--serie); }
.ev.err { fill: var(--crit); }
.ev.ini { fill: var(--serie-suave); }
.ev.fin { fill: var(--fg3); }
.resumen { font-size: 12.5px; color: var(--fg2); padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--fg3); font-size: 12px; margin: 10px 2px 0; }
.leyenda i { display: inline-block; width: 3px; height: 12px; vertical-align: middle; margin-right: 6px; }
.vacio { color: var(--fg2); padding: 24px 18px; margin: 0; }
@media (max-width: 760px) {
  .grilla { grid-template-columns: minmax(0, 1fr); }
  .enc > span:not(:first-child) { display: none; }
  .fila > .resumen { padding-left: 0; border-bottom: 1px solid var(--borde); }
  .fila > .nombre, .fila > .carril { border-bottom: 0; }
}
</style>
</head>
<body>
<div class="marco">
  <div class="barra-sup">
    <div class="marca">hz <span>· panel de agentes</span></div>
    <div class="controles" role="group" aria-label="Ventana de tiempo de los carriles">
      <button type="button" data-ventana="5m">5 min</button>
      <button type="button" data-ventana="10m">10 min</button>
      <button type="button" data-ventana="30m">30 min</button>
      <span id="estado" aria-live="polite">conectando…</span>
    </div>
  </div>
  <main id="vista"><p class="vacio">Cargando…</p></main>
</div>
<script src="/app.js"></script>
</body>
</html>
